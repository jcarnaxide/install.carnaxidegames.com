<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rockhopper: Space Miner</title>
    <meta name="description" content="Space mining in 3D: fly the belt, crack asteroids for crystals, build your ship. By Carnaxide Games.">

    <!-- Open Graph Metadata -->
    <meta property="og:title" content="Rockhopper: Space Miner">
    <meta property="og:description" content="Space mining in 3D: fly the belt, crack asteroids for crystals, build your ship. By Carnaxide Games.">
    <meta property="og:image" content="https://install.carnaxidegames.com/public/images/rockhopper.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="The Rockhopper icon, a little ship over a cracked asteroid studded with crystals, beside the word Rockhopper">
    <meta property="og:url" content="https://install.carnaxidegames.com/games/spacemine">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Phones go straight to their store; everyone else stays on this page. -->
    <script src="/public/scripts/redirect.js"></script>
    <script>
        const PLAY_URL = "https://play.google.com/store/apps/details?id=com.carnaxide_games.spacemine";
        const APP_STORE_URL = "https://apps.apple.com/us/app/rockhopper-space-miner/id6831621115";
        const platform = detectPlatform();
        if (platform === "android" || platform === "ios") {
            redirectToPlatform({ android: PLAY_URL, ios: APP_STORE_URL });
        }
    </script>

    <style>
        :root {
            --bg: #f7f5f0; --surface: #ffffff; --ink: #1f2430; --muted: #6b7280;
            --line: #d4d0c8; --accent: #3b82f6;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #15181f; --surface: #1f2430; --ink: #f2f0ea; --muted: #a3a9b6; --line: #343a48; }
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; background: var(--bg); color: var(--ink); }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 32px 16px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        main { width: 100%; max-width: 640px; text-align: center; }
        .card {
            width: 100%; height: auto; display: block; border-radius: 16px;
            border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(31, 36, 48, .10);
        }
        h1 { font-size: clamp(40px, 9vw, 56px); letter-spacing: -1px; margin: 32px 0 8px; }
        .tag { font-size: 20px; margin: 0 0 8px; }
        .sub { color: var(--muted); font-size: 17px; line-height: 1.5; margin: 0 auto 28px; max-width: 30em; }
        .play {
            display: inline-block; background: var(--ink); color: var(--bg); text-decoration: none;
            font-weight: 600; font-size: 18px; padding: 14px 28px; border-radius: 12px;
        }
        .play:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
        .stores { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
        footer { color: var(--muted); font-size: 13px; margin-top: 40px; }
        footer a { color: inherit; }
    </style>
</head>
<body>
    <main>
        <img class="card" src="/public/images/rockhopper.jpg" width="1200" height="630"
             alt="The Rockhopper icon, a little ship over a cracked asteroid studded with crystals, beside the word Rockhopper">
        <h1>Rockhopper</h1>
        <p class="tag">Space Miner</p>
        <p class="sub">Space mining in 3D: fly the belt, crack asteroids for crystals, build your ship.</p>
        <div class="stores">
            <a class="play" href="https://apps.apple.com/us/app/rockhopper-space-miner/id6831621115">Download on the App Store</a>
            <a class="play" href="https://play.google.com/store/apps/details?id=com.carnaxide_games.spacemine">Get it on Google Play</a>
        </div>
        <footer>By <a href="https://www.carnaxidegames.com/">Carnaxide Games</a></footer>
    </main>
</body>
</html>
